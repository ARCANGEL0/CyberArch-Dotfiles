# ==============================================================================
# ARASAKA UI — cyberpunk neon (Cyberpunk 2077 / Arasaka corp)
# Red-dominant surface (#ff1e3c) with cyan/yellow/magenta/green neon pops,
# bright-yellow active tab, black-red bg. No white anywhere.
# ==============================================================================
allow_remote_control yes
listen_on unix:/tmp/kitty-arasaka

# ── surface ───────────────────────────────────────────────────────────────────
background            #080002
foreground            #ff4d5e
background_opacity    0.80
dynamic_background_opacity yes
background_blur       32
dim_opacity           0.50
inactive_text_alpha   0.72

selection_background  #ff1e3c
selection_foreground  #080002
url_color             #ff4d5e
url_style             curly

window_padding_width  16
placement_strategy    center
draw_minimal_borders  yes
window_border_width   1.5pt
hide_window_decorations no
active_border_color   #ff1e3c
inactive_border_color #3a0f16
mouse_hide_wait   3.0
confirm_os_window_close 0

# ── type ──────────────────────────────────────────────────────────────────────
font_family          JetBrains Mono
bold_font            JetBrains Mono Bold
italic_font          JetBrains Mono Italic
font_size            11.0
adjust_column_width  102%
disable_ligatures    cursor
text_composition_strategy platform
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+F000-U+F2FF,U+F300-U+F381 Symbols Nerd Font

repaint_delay    6
input_delay      0
sync_to_monitor  yes

# ── cursor (red trail) ────────────────────────────────────────────────────────
cursor                #ff1e3c
cursor_text_color     #080002
cursor_shape          beam
cursor_beam_thickness 2.2
cursor_blink_interval 0.5
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_trail_start_threshold 2

enable_audio_bell     no
visual_bell_duration  0.12
visual_bell_color     #ff1e3c
window_alert_on_bell  yes
bell_on_tab           "⚡ "

# ── tab bar (slanted, like the in-game panel cuts) ────────────────────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     angled
tab_bar_min_tabs        1
tab_activity_symbol     "⌁ "
tab_title_template      "{index}▸{title}"
active_tab_background    #fce300
active_tab_foreground    #080002
active_tab_font_style    bold
inactive_tab_background  #1a060a
inactive_tab_foreground  #c25c6e
tab_bar_background       #050102

# ── scrollback marks ──────────────────────────────────────────────────────────
mark1_foreground #080002
mark1_background #ff1e3c
mark2_foreground #080002
mark2_background #ff5c6e
mark3_foreground #080002
mark3_background #ff4d5e
scrollback_lines 20000

# ── palette: CYBERPUNK NEON (red dominant + cyan / yellow / magenta pops) ─────
color0  #0e0304
color8  #5a1a24
color1  #ff1e3c
color9  #ff6b7d
color2  #39ff88
color10 #7dffb5
color3  #fce300
color11 #ffe66b
color4  #00b4ff
color12 #4dd2ff
color5  #ff29d4
color13 #ff7de8
color6  #00ffc8
color14 #5fffe0
color7  #ff4d5e
color15 #ff8f9c

# ── keys ──────────────────────────────────────────────────────────────────────
map ctrl+shift+plus   change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+alt+up   set_background_opacity +0.05
map ctrl+shift+alt+down set_background_opacity -0.05
map ctrl+shift+alt+0    set_background_opacity default